name: Shell
options:
  bundleIdPrefix: com.xingchen
  deploymentTarget:
    iOS: "13.0"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  Shell:
    type: application
    platform: iOS
    sources:
      - path: Shell
        excludes:
          - "www"
      - path: Shell/www
        type: folder
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.xingchen.bhc
        INFOPLIST_FILE: Shell/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        ENABLE_BITCODE: "NO"
        CODE_SIGN_STYLE: Manual
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGNING_ALLOWED: "NO"

schemes:
  Shell:
    build:
      targets:
        Shell: all
    run:
      config: Release
